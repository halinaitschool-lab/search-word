<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пошук слів - Інтерактивна гра</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 700px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            font-size: 1em;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 3px;
            margin: 20px auto;
            max-width: 100%;
            background: #f0f0f0;
            padding: 8px;
            border-radius: 10px;
            touch-action: none;
        }

        .cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .cell:hover {
            background: #f8f8ff;
            transform: scale(1.05);
        }

        .cell.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .cell.found {
            background: #48bb78;
            color: white;
            border-color: #48bb78;
            animation: pulse 0.5s;
        }

        .cell.revealed {
            background: #f6ad55;
            color: white;
            border-color: #f6ad55;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .words-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 8px;
            margin-top: 20px;
        }

        .word-item {
            padding: 10px 15px;
            background: #f7fafc;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            font-size: 0.9em;
            color: #4a5568;
            border: 2px solid #e2e8f0;
            transition: all 0.3s;
        }

        .word-item.found {
            background: #48bb78;
            color: white;
            border-color: #48bb78;
            text-decoration: line-through;
        }

        .word-item.revealed {
            background: #f6ad55;
            color: white;
            border-color: #f6ad55;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            padding: 15px;
            background: #f7fafc;
            border-radius: 10px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            margin-top: 5px;
            font-size: 0.9em;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .reset-btn, .reveal-btn {
            flex: 1;
            min-width: 140px;
            padding: 15px 20px;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .reset-btn {
            background: #667eea;
        }

        .reset-btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .reveal-btn {
            background: #f6ad55;
        }

        .reveal-btn:hover {
            background: #ed8936;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .reveal-btn:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
            transform: none;
        }

        .victory-message {
            display: none;
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            color: white;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 1.2em;
            font-weight: bold;
            animation: slideIn 0.5s;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .victory-message.show {
            display: block;
        }

        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }

            h1 {
                font-size: 1.5em;
            }

            .subtitle {
                font-size: 0.9em;
            }

            .cell {
                font-size: 0.75em;
                border-width: 1px;
            }

            .game-board {
                gap: 2px;
                padding: 5px;
            }

            .stat-value {
                font-size: 1.5em;
            }

            .words-list {
                grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
                gap: 6px;
            }

            .word-item {
                padding: 8px 12px;
                font-size: 0.85em;
            }

            .reset-btn, .reveal-btn {
                font-size: 0.9em;
                padding: 12px 15px;
            }
        }

        @media (max-width: 400px) {
            .cell {
                font-size: 0.65em;
            }

            .game-board {
                gap: 1px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Пошук слів</h1>
        <p class="subtitle">Знайдіть всі слова в сітці!</p>

        <div class="game-board" id="gameBoard"></div>

        <div class="words-list" id="wordsList"></div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="foundCount">0</div>
                <div class="stat-label">Знайдено</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="totalCount">10</div>
                <div class="stat-label">Всього</div>
            </div>
        </div>

        <div class="victory-message" id="victoryMessage">
            🎉 Вітаємо! Ви знайшли всі слова! 🎉
        </div>

        <div class="button-group">
            <button class="reveal-btn" id="revealBtn" onclick="revealAnswers()">💡 Дізнатись відповіді</button>
            <button class="reset-btn" onclick="initGame()">🔄 Нова гра</button>
        </div>
    </div>

    <script>
        const words = [
            'ЛЕНДІНГ',
            'ДІЯ',
            'СТОРІНКА',
            'СПИШ',
            'ПРОДАЄ',
            'ЗАМОВИТИ',
            'КУПИТИ',
            'ПРОФЕСІЙНО',
            'САЙТ',
            'СТРУКТУРА'
        ];

        const gridSize = 12;
        let grid = [];
        let wordPositions = [];
        let selectedCells = [];
        let foundWords = new Set();
        let isSelecting = false;
        let answersRevealed = false;

        function createEmptyGrid() {
            return Array(gridSize).fill(null).map(() => Array(gridSize).fill(''));
        }

        function canPlaceWord(word, row, col, direction) {
            const [dx, dy] = direction;
            
            for (let i = 0; i < word.length; i++) {
                const newRow = row + (dy * i);
                const newCol = col + (dx * i);
                
                if (newRow < 0 || newRow >= gridSize || newCol < 0 || newCol >= gridSize) {
                    return false;
                }
                
                if (grid[newRow][newCol] !== '' && grid[newRow][newCol] !== word[i]) {
                    return false;
                }
            }
            
            return true;
        }

        function placeWord(word, row, col, direction) {
            const [dx, dy] = direction;
            const positions = [];
            
            for (let i = 0; i < word.length; i++) {
                const newRow = row + (dy * i);
                const newCol = col + (dx * i);
                grid[newRow][newCol] = word[i];
                positions.push({ row: newRow, col: newCol });
            }
            
            wordPositions.push({ word, positions });
        }

        function fillRandomLetters() {
            const ukrainianLetters = 'АБВГДЕЄЖЗИІЇЙКЛМНОПРСТУФХЦЧШЩЬЮЯ';
            
            for (let i = 0; i < gridSize; i++) {
                for (let j = 0; j < gridSize; j++) {
                    if (grid[i][j] === '') {
                        grid[i][j] = ukrainianLetters[Math.floor(Math.random() * ukrainianLetters.length)];
                    }
                }
            }
        }

        function initGame() {
            grid = createEmptyGrid();
            wordPositions = [];
            foundWords = new Set();
            selectedCells = [];
            answersRevealed = false;
            
            const directions = [
                [1, 0],   // horizontal
                [0, 1],   // vertical
            ];
            
            words.forEach(word => {
                let placed = false;
                let attempts = 0;
                
                while (!placed && attempts < 100) {
                    const row = Math.floor(Math.random() * gridSize);
                    const col = Math.floor(Math.random() * gridSize);
                    const direction = directions[Math.floor(Math.random() * directions.length)];
                    
                    if (canPlaceWord(word, row, col, direction)) {
                        placeWord(word, row, col, direction);
                        placed = true;
                    }
                    
                    attempts++;
                }
            });
            
            fillRandomLetters();
            renderGrid();
            renderWordsList();
            updateStats();
            document.getElementById('victoryMessage').classList.remove('show');
            document.getElementById('revealBtn').disabled = false;
            document.getElementById('revealBtn').textContent = '💡 Дізнатись відповіді';
        }

        function renderGrid() {
            const gameBoard = document.getElementById('gameBoard');
            gameBoard.innerHTML = '';
            
            for (let i = 0; i < gridSize; i++) {
                for (let j = 0; j < gridSize; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.textContent = grid[i][j];
                    cell.dataset.row = i;
                    cell.dataset.col = j;
                    
                    // Mouse events
                    cell.addEventListener('mousedown', startSelection);
                    cell.addEventListener('mouseenter', continueSelection);
                    cell.addEventListener('mouseup', endSelection);
                    
                    // Touch events for mobile
                    cell.addEventListener('touchstart', handleTouchStart);
                    cell.addEventListener('touchmove', handleTouchMove);
                    cell.addEventListener('touchend', handleTouchEnd);
                    
                    gameBoard.appendChild(cell);
                }
            }
        }

        function renderWordsList() {
            const wordsList = document.getElementById('wordsList');
            wordsList.innerHTML = '';
            
            words.forEach(word => {
                const wordItem = document.createElement('div');
                wordItem.className = 'word-item';
                wordItem.textContent = word;
                if (foundWords.has(word)) {
                    wordItem.classList.add('found');
                } else if (answersRevealed) {
                    wordItem.classList.add('revealed');
                }
                wordsList.appendChild(wordItem);
            });
        }

        function startSelection(e) {
            isSelecting = true;
            selectedCells = [];
            clearSelection();
            selectCell(e.target);
        }

        function continueSelection(e) {
            if (isSelecting) {
                selectCell(e.target);
            }
        }

        function endSelection() {
            if (isSelecting) {
                checkWord();
                clearSelection();
                isSelecting = false;
            }
        }

        function selectCell(cell) {
            if (!cell.classList.contains('cell')) return;
            if (!selectedCells.includes(cell)) {
                selectedCells.push(cell);
                cell.classList.add('selected');
            }
        }

        function clearSelection() {
            document.querySelectorAll('.cell.selected').forEach(cell => {
                cell.classList.remove('selected');
            });
        }

        function checkWord() {
            const selectedWord = selectedCells.map(cell => cell.textContent).join('');
            const reversedWord = selectedCells.map(cell => cell.textContent).reverse().join('');
            
            wordPositions.forEach(({ word, positions }) => {
                if ((selectedWord === word || reversedWord === word) && !foundWords.has(word)) {
                    foundWords.add(word);
                    positions.forEach(pos => {
                        const cell = document.querySelector(`[data-row="${pos.row}"][data-col="${pos.col}"]`);
                        cell.classList.add('found');
                    });
                    updateStats();
                    renderWordsList();
                    
                    if (foundWords.size === words.length) {
                        setTimeout(() => {
                            document.getElementById('victoryMessage').classList.add('show');
                        }, 500);
                    }
                }
            });
        }

        function updateStats() {
            document.getElementById('foundCount').textContent = foundWords.size;
        }

        // Touch event handlers for mobile
        function handleTouchStart(e) {
            e.preventDefault();
            isSelecting = true;
            selectedCells = [];
            clearSelection();
            selectCell(e.target);
        }

        function handleTouchMove(e) {
            e.preventDefault();
            if (isSelecting) {
                const touch = e.touches[0];
                const element = document.elementFromPoint(touch.clientX, touch.clientY);
                if (element && element.classList.contains('cell')) {
                    selectCell(element);
                }
            }
        }

        function handleTouchEnd(e) {
            e.preventDefault();
            if (isSelecting) {
                checkWord();
                clearSelection();
                isSelecting = false;
            }
        }

        function revealAnswers() {
            if (answersRevealed) return;
            
            answersRevealed = true;
            
            wordPositions.forEach(({ word, positions }) => {
                if (!foundWords.has(word)) {
                    positions.forEach(pos => {
                        const cell = document.querySelector(`[data-row="${pos.row}"][data-col="${pos.col}"]`);
                        cell.classList.add('revealed');
                    });
                }
            });
            
            renderWordsList();
            document.getElementById('revealBtn').disabled = true;
            document.getElementById('revealBtn').textContent = '✓ Відповіді показано';
        }

        document.addEventListener('mouseup', () => {
            isSelecting = false;
        });

        initGame();
    </script>
</body>
</html>
